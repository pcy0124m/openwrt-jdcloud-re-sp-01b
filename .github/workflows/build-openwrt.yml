name: Build OpenWrt for JDCloud RE-SP-01B

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v25.12.2
  CONFIG_FILE: config/jdcloud-re-sp-01b.config
  DIY_SH: diy.sh
  TZ: Asia/Shanghai
  OPENWRT_MIRROR: https://mirrors.aliyun.com/openwrt
  DOWNLOAD_MIRROR: https://mirrors.aliyun.com/openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo sed -i 's|http://archive.ubuntu.com/ubuntu/|https://mirrors.aliyun.com/ubuntu/|g' /etc/apt/sources.list
        sudo sed -i 's|http://security.ubuntu.com/ubuntu/|https://mirrors.aliyun.com/ubuntu/|g' /etc/apt/sources.list
        sudo apt-get update
        sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano python3 python3-pip python3-pexpect python3-yaml rsync sphinx-doc subversion swig texinfo uglifyjs upx-ucl unzip wget zlib1g-dev
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git submodule update --init --recursive

    - name: Apply patches
      run: |
        cp $GITHUB_WORKSPACE/diy.sh openwrt/
        cd openwrt
        bash diy.sh

    - name: Download feeds
      run: |
        cd openwrt
        # 关键修复：CI 直连 git.openwrt.org 不稳定导致 luci/packages feed
        # 静默更新失败 → 固件缺 LuCI 网页界面。改用 GitHub 官方镜像。
        sed -i 's#https://git.openwrt.org/feed/#https://github.com/openwrt/#g; s#https://git.openwrt.org/project/#https://github.com/openwrt/#g' feeds.conf.default
        # （测试版 #54：单独验证中文语言包能否启动，暂不添加 iStore 源 / 不含 Argon）
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 校验 luci feed 真正安装到位（luci-base 是 LuCI 核心，缺它即无管理界面）
        if [ ! -d package/feeds/luci/luci-base ]; then
          echo "::error::luci feed 未安装！无法生成带 Web 界面的固件"
          ls -la package/feeds/ 2>/dev/null || true
          exit 1
        fi
        echo "luci feed 安装确认: OK"

        # 添加 Argon 主题（第三方蓝色现代化界面，jerrykuku 维护，兼容 luci 2.x / OpenWrt 24.10+）
        rm -rf package/luci-theme-argon
        git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
        if [ ! -f package/luci-theme-argon/Makefile ]; then
          echo "::warning::Argon 主题源码未克隆成功，本次将使用默认 bootstrap 主题"
        else
          echo "Argon 主题源码确认: OK"
        fi
        # 调试：打印 feeds/luci 中实际可用的中文(zh)语言包，便于确认 25.12 真实包名
        echo "=== feeds/luci 中的 i18n/zh 包 ==="
        ls package/feeds/luci/ 2>/dev/null | grep -iE "i18n.*zh|zh.*i18n" || echo "(无匹配 zh 包)"

    - name: Apply config
      run: |
        cd openwrt
        # === 策略变更：基于官方默认配置叠加（不再用手写完整 config）===
        # 官方默认 config 已包含完整的 uhttpd+luci-ssl Web 栈
        # 我们只在此基础上加自定义包（Argon 主题等）

        # Step 1: 创建最小 config（只设目标设备）
        cat > .config << 'MINICONFIG'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y
        MINICONFIG

        # Step 2: defconfig → 生成官方完整默认配置（含 uhttpd+luci 全套）
        echo "=== Step 2: make defconfig（官方默认配置）==="
        make defconfig
        echo "--- 默认配置中 uhttpd/luci 状态 ---"
        grep -E "CONFIG_PACKAGE_uhttpd|CONFIG_PACKAGE_luci-ssl|CONFIG_PACKAGE_luci-base|CONFIG_PACKAGE_luci-mod-admin" .config | head -10

        # Step 3: 显式启用完整 Web 栈（关键！defconfig 默认不装 luci）
        echo "=== Step 3: 显式启用 uhttpd + luci 完整 Web 栈 ==="
        cat >> .config << 'EXTRAS'
        # === Web 服务器 ===
        CONFIG_PACKAGE_uhttpd=y
        CONFIG_PACKAGE_uhttpd-mod-ubus=y
        # === LuCI 核心（显式启用，defconfig 默认不装）===
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-mod-admin-network=y
        CONFIG_PACKAGE_luci-mod-admin-status=y
        CONFIG_PACKAGE_luci-mod-admin-system=y
        # === 后端接口（luci 依赖，显式声明确保不被取消）===
        CONFIG_PACKAGE_rpcd=y
        CONFIG_PACKAGE_rpcd-mod-file=y
        CONFIG_PACKAGE_rpcd-mod-iwinfo=y
        CONFIG_PACKAGE_rpcd-mod-luci=y
        CONFIG_PACKAGE_rpcd-mod-rpcsys=y
        CONFIG_PACKAGE_rpcd-mod-rrdns=y
        CONFIG_PACKAGE_rpcd-mod-ucode=y
        # === 运行时依赖 ===
        CONFIG_PACKAGE_cgi-io=y
        CONFIG_PACKAGE_libiwinfo=y
        CONFIG_PACKAGE_libiwinfo-data=y
        CONFIG_PACKAGE_liblucihttp=y
        CONFIG_PACKAGE_liblucihttp-ucode=y
        CONFIG_PACKAGE_px5g-mbedtls=y
        # === 自定义主题（本测试版仅验证中文，不含 Argon，使用默认 bootstrap）===
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        # === 中文语言包（OpenWrt 25.12 / luci 26.x）===
        # 关键：中文语言总开关是 CONFIG_LUCI_LANG_zh_Hans（父），luci-i18n-* 子包 depends on 它。
        # 只设子包 defconfig 会级联丢弃，必须同时设父开关。
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_PACKAGE_luci-i18n-base-zh_Hans=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh_Hans=y
        # === 测试版 #54：仅中文（隔离 Argon），验证中文语言包是否导致启动失败 ===
        EXTRAS

        # Step 4: 再次 defconfig 解析新增包的依赖
        echo "=== Step 4: make defconfig（解析自定义包依赖）==="
        make defconfig

        # 关键校验：defconfig 后 LuCI 必须仍为选中，否则生成残缺固件
        if ! grep -q "^CONFIG_PACKAGE_luci=y" .config; then
          echo "::error::defconfig 后 luci 被取消！Web 界面将缺失，终止构建"
          grep -E "CONFIG_PACKAGE_luci" .config | head
          exit 1
        fi
        echo "LuCI 选中确认: OK"
        # 测试版 #54：验证中文语言包选中（核心需求，fail-fast：包名若仍不对立即报错）
        if grep -qiE "^CONFIG_LUCI_LANG_zh_Hans=y" .config; then
          echo "中文语言包 选中确认: OK (CONFIG_LUCI_LANG_zh_Hans=y)"
        else
          echo "::error::中文语言开关(CONFIG_LUCI_LANG_zh_Hans)未被选中！终止构建"
          echo "=== 当前 .config 中 zh / LUCI_LANG 相关行 ==="
          grep -iE "zh_Hans|zh_Hant|LUCI_LANG|i18n" .config | head -20
          exit 1
        fi

        # Step 5: 强制启用固件镜像生成
        echo "=== Step 5: 强制启用固件镜像 ==="
        sed -i 's/# CONFIG_TARGET_ROOTFS_SQUASHFS is not set/CONFIG_TARGET_ROOTFS_SQUASHFS=y/' .config
        sed -i 's/# CONFIG_TARGET_ROOTFS_INITRAMFS is not set/CONFIG_TARGET_ROOTFS_INITRAMFS=y/' .config
        sed -i 's/# CONFIG_TARGET_IMAGES_GZIP is not set/CONFIG_TARGET_IMAGES_GZIP=y/' .config
        # 强制锁定中文语言开关、子包（覆盖 defconfig 可能误取消的情况）
        sed -i 's/^# CONFIG_LUCI_LANG_zh_Hans is not set/CONFIG_LUCI_LANG_zh_Hans=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-base-zh_Hans is not set/CONFIG_PACKAGE_luci-i18n-base-zh_Hans=y/' .config
        sed -i 's/^# CONFIG_PACKAGE_luci-i18n-firewall-zh_Hans is not set/CONFIG_PACKAGE_luci-i18n-firewall-zh_Hans=y/' .config
        make defconfig

        # 最终确认关键包已启用
        echo "=== 最终配置确认 ==="
        grep -E "CONFIG_PACKAGE_uhttpd|CONFIG_PACKAGE_luci-ssl|CONFIG_PACKAGE_luci-base|CONFIG_PACKAGE_luci-mod-admin|CONFIG_PACKAGE_luci-i18n-base-zh_Hans|CONFIG_PACKAGE_rpcd|CONFIG_LUCI_LANG_zh_Hans" .config | head -15
        echo "--- rootfs 配置 ---"
        grep -E "TARGET_ROOTFS|TARGET_IMAGES" .config | head -5

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -la {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile
      id: compile
      run: |
        cd openwrt
        export PATH="$PATH:$PWD/staging_dir/host/bin"
        mkdir -p /tmp/build_logs
        # 阶段1: 编译工具链
        echo "===== 阶段1: 编译工具链 ====="
        make tools/install -j$(nproc) 2>&1 | tee /tmp/build_logs/tools.log || {
          echo "[ERROR] tools 编译失败" >> /tmp/build_logs/error.log
          echo "status=1" >> $GITHUB_OUTPUT
          exit 0
        }
        make toolchain/install -j$(nproc) 2>&1 | tee /tmp/build_logs/toolchain.log || {
          echo "[ERROR] toolchain 编译失败" >> /tmp/build_logs/error.log
          echo "status=1" >> $GITHUB_OUTPUT
          exit 0
        }
        # 阶段2: 并行编译全部目标
        echo "===== 阶段2: 并行编译 ====="
        make -j$(nproc) 2>&1 | tee /tmp/build_logs/parallel_build.log || {
          echo "[ERROR] 编译失败, 切换单线程..." >> /tmp/build_logs/error.log
          make -j1 V=s 2>&1 | tee /tmp/build_logs/verbose_build.log || true
          echo "status=1" >> $GITHUB_OUTPUT
          exit 0
        }
        # 阶段3: 强制生成固件镜像（关键！）
        echo "===== 阶段3: 强制生成固件镜像 ====="
        make target/install -j$(nproc) 2>&1 | tee /tmp/build_logs/target_install.log || {
          echo "[WARN] target/install 失败，尝试单线程..."
          make target/install -j1 V=s 2>&1 | tee /tmp/build_logs/target_install_verbose.log || true
        }

    - name: Check Firmware
      id: image
      run: |
        cd openwrt
        mkdir -p /tmp/build_logs
        echo "===== 检查固件 ====="
        echo "--- bin/targets 目录结构 ---"
        find bin/targets/ -type f 2>/dev/null | head -30
        echo ""
        echo "--- bin/targets 各子目录大小 ---"
        du -sh bin/targets/*/ 2>/dev/null || true
        echo ""
        FIRMWARE=$(find bin/targets/ -type f -name "*sysupgrade*.bin" -o -name "*squashfs*.bin" 2>/dev/null | head -10)
        if [ -n "$FIRMWARE" ]; then
          echo "[OK] 固件已生成:"
          ls -lh $FIRMWARE
          echo "has_firmware=yes" >> $GITHUB_OUTPUT
          # 记录固件路径供后续使用
          echo "$FIRMWARE" > /tmp/firmware_list.txt
        else
          # 尝试找任何 .bin 文件
          ALL_BIN=$(find bin/targets/ -type f -name "*.bin" 2>/dev/null)
          if [ -n "$ALL_BIN" ]; then
            echo "[OK] 找到 .bin 文件:"
            ls -lh $ALL_BIN
            echo "has_firmware=yes" >> $GITHUB_OUTPUT
            echo "$ALL_BIN" > /tmp/firmware_list.txt
          else
            echo "[ERROR] 无任何 .bin 固件!"
            echo "--- 当前 rootfs 配置 ---"
            grep -E "TARGET_ROOTFS|TARGET_IMAGES|CONFIG_PACKAGE_uhttpd|CONFIG_PACKAGE_luci" .config 2>/dev/null || echo "(未找到)"
            echo "has_firmware=no" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Upload build outputs (always)
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-jdcloud-re-sp-01b
        path: openwrt/bin/targets/

    - name: Upload logs (always)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: /tmp/build_logs/

    - name: Prepare release files
      id: prep
      if: steps.image.outputs.has_firmware == 'yes'
      run: |
        mkdir -p release
        cp -r openwrt/bin/targets/ramips/mt7621/* release/ 2>/dev/null || true
        echo "=== 待发布文件 ===" && ls -lh release/
        echo "firmware_count=$(ls release/ | wc -l)" >> $GITHUB_OUTPUT

    - name: Create Release and Upload Firmware
      uses: softprops/action-gh-release@v2
      if: steps.image.outputs.has_firmware == 'yes' && steps.prep.outputs.firmware_count != '0'
      with:
        tag_name: jdcloud-re-sp-01b-${{ github.run_number }}
        name: OpenWrt 京东云一代 RE-SP-01B #${{ github.run_number }}
        files: release/*
        body: |
          ## JDCloud RE-SP-01B（京东云一代）OpenWrt 固件

          - 源码：openwrt/openwrt v25.12.2
          - 刷机：通过 Breed 上传 `*-squashfs-sysupgrade.bin`
          - 默认管理地址：`192.168.12.1`
          - 用户名：`root`，密码：`pcy831121`
          - 主题：bootstrap（默认，本测试版仅验证中文语言包）
          - 中文：包含（luci-i18n-base-zh + firewall-zh）
          - 应用商店：本测试版未包含（隔离变量：仅测中文是否导致启动失败）
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
