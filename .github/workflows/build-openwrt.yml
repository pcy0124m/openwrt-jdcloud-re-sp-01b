name: Build OpenWrt for JDCloud RE-SP-01B

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v25.12.2
  CONFIG_FILE: config/jdcloud-re-sp-01b.config
  DIY_SH: diy.sh
  TZ: Asia/Shanghai
  OPENWRT_MIRROR: https://mirrors.aliyun.com/openwrt
  DOWNLOAD_MIRROR: https://mirrors.aliyun.com/openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo sed -i 's|http://archive.ubuntu.com/ubuntu/|https://mirrors.aliyun.com/ubuntu/|g' /etc/apt/sources.list
        sudo sed -i 's|http://security.ubuntu.com/ubuntu/|https://mirrors.aliyun.com/ubuntu/|g' /etc/apt/sources.list
        sudo apt-get update
        sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano python3 python3-pip python3-pexpect python3-yaml rsync sphinx-doc subversion swig texinfo uglifyjs upx-ucl unzip wget zlib1g-dev
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git submodule update --init --recursive

    - name: Apply patches
      run: |
        cp $GITHUB_WORKSPACE/diy.sh openwrt/
        cd openwrt
        bash diy.sh

    - name: Download feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Clone helloworld feed (Argon theme)
      run: |
        cd openwrt
        rm -rf package/feeds/helloworld
        git clone --depth 1 https://github.com/fw876/helloworld.git package/feeds/helloworld
        ./scripts/feeds install -d y -f -p helloworld

    - name: Apply config
      run: |
        cd openwrt
        # === 策略变更：基于官方默认配置叠加（不再用手写完整 config）===
        # 官方默认 config 已包含完整的 uhttpd+luci-ssl Web 栈
        # 我们只在此基础上加自定义包（Argon 主题等）

        # Step 1: 创建最小 config（只设目标设备）
        cat > .config << 'MINICONFIG'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y
        MINICONFIG

        # Step 2: defconfig → 生成官方完整默认配置（含 uhttpd+luci 全套）
        echo "=== Step 2: make defconfig（官方默认配置）==="
        make defconfig
        echo "--- 默认配置中 uhttpd/luci 状态 ---"
        grep -E "CONFIG_PACKAGE_uhttpd|CONFIG_PACKAGE_luci-ssl|CONFIG_PACKAGE_luci-base|CONFIG_PACKAGE_luci-mod-admin" .config | head -10

        # Step 3: 追加我们需要的额外包（Argon 主题、中文等）
        echo "=== Step 3: 追加自定义包 ==="
        cat >> .config << 'EXTRAS'
        # 自定义主题
        CONFIG_PACKAGE_luci-theme-argon=y
        # 中文语言包
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
        # helloworld feed 的常用插件（Passwall 等）
        CONFIG_PACKAGE_luci-app-passwall=y
        EXTRAS

        # Step 4: 再次 defconfig 解析新增包的依赖
        echo "=== Step 4: make defconfig（解析自定义包依赖）==="
        make defconfig

        # Step 5: 强制启用固件镜像生成
        echo "=== Step 5: 强制启用固件镜像 ==="
        sed -i 's/# CONFIG_TARGET_ROOTFS_SQUASHFS is not set/CONFIG_TARGET_ROOTFS_SQUASHFS=y/' .config
        sed -i 's/# CONFIG_TARGET_ROOTFS_INITRAMFS is not set/CONFIG_TARGET_ROOTFS_INITRAMFS=y/' .config
        sed -i 's/# CONFIG_TARGET_IMAGES_GZIP is not set/CONFIG_TARGET_IMAGES_GZIP=y/' .config
        make defconfig

        # 最终确认关键包已启用
        echo "=== 最终配置确认 ==="
        grep -E "CONFIG_PACKAGE_uhttpd|CONFIG_PACKAGE_luci-ssl|CONFIG_PACKAGE_luci-base|CONFIG_PACKAGE_luci-mod-admin|CONFIG_PACKAGE_luci-theme-argon|CONFIG_PACKAGE_rpcd" .config | head -15
        echo "--- rootfs 配置 ---"
        grep -E "TARGET_ROOTFS|TARGET_IMAGES" .config | head -5

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -la {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile
      id: compile
      run: |
        cd openwrt
        export PATH="$PATH:$PWD/staging_dir/host/bin"
        mkdir -p /tmp/build_logs
        # 阶段1: 编译工具链
        echo "===== 阶段1: 编译工具链 ====="
        make tools/install -j$(nproc) 2>&1 | tee /tmp/build_logs/tools.log || {
          echo "[ERROR] tools 编译失败" >> /tmp/build_logs/error.log
          echo "status=1" >> $GITHUB_OUTPUT
          exit 0
        }
        make toolchain/install -j$(nproc) 2>&1 | tee /tmp/build_logs/toolchain.log || {
          echo "[ERROR] toolchain 编译失败" >> /tmp/build_logs/error.log
          echo "status=1" >> $GITHUB_OUTPUT
          exit 0
        }
        # 阶段2: 并行编译全部目标
        echo "===== 阶段2: 并行编译 ====="
        make -j$(nproc) 2>&1 | tee /tmp/build_logs/parallel_build.log || {
          echo "[ERROR] 编译失败, 切换单线程..." >> /tmp/build_logs/error.log
          make -j1 V=s 2>&1 | tee /tmp/build_logs/verbose_build.log || true
          echo "status=1" >> $GITHUB_OUTPUT
          exit 0
        }
        # 阶段3: 强制生成固件镜像（关键！）
        echo "===== 阶段3: 强制生成固件镜像 ====="
        make target/install -j$(nproc) 2>&1 | tee /tmp/build_logs/target_install.log || {
          echo "[WARN] target/install 失败，尝试单线程..."
          make target/install -j1 V=s 2>&1 | tee /tmp/build_logs/target_install_verbose.log || true
        }

    - name: Check Firmware
      id: image
      run: |
        cd openwrt
        mkdir -p /tmp/build_logs
        echo "===== 检查固件 ====="
        echo "--- bin/targets 目录结构 ---"
        find bin/targets/ -type f 2>/dev/null | head -30
        echo ""
        echo "--- bin/targets 各子目录大小 ---"
        du -sh bin/targets/*/ 2>/dev/null || true
        echo ""
        FIRMWARE=$(find bin/targets/ -type f -name "*sysupgrade*.bin" -o -name "*squashfs*.bin" 2>/dev/null | head -10)
        if [ -n "$FIRMWARE" ]; then
          echo "[OK] 固件已生成:"
          ls -lh $FIRMWARE
          echo "has_firmware=yes" >> $GITHUB_OUTPUT
          # 记录固件路径供后续使用
          echo "$FIRMWARE" > /tmp/firmware_list.txt
        else
          # 尝试找任何 .bin 文件
          ALL_BIN=$(find bin/targets/ -type f -name "*.bin" 2>/dev/null)
          if [ -n "$ALL_BIN" ]; then
            echo "[OK] 找到 .bin 文件:"
            ls -lh $ALL_BIN
            echo "has_firmware=yes" >> $GITHUB_OUTPUT
            echo "$ALL_BIN" > /tmp/firmware_list.txt
          else
            echo "[ERROR] 无任何 .bin 固件!"
            echo "--- 当前 rootfs 配置 ---"
            grep -E "TARGET_ROOTFS|TARGET_IMAGES|CONFIG_PACKAGE_uhttpd|CONFIG_PACKAGE_luci" .config 2>/dev/null || echo "(未找到)"
            echo "has_firmware=no" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Upload build outputs (always)
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-jdcloud-re-sp-01b
        path: openwrt/bin/targets/

    - name: Upload logs (always)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: /tmp/build_logs/

    - name: Prepare release files
      id: prep
      if: steps.image.outputs.has_firmware == 'yes'
      run: |
        mkdir -p release
        cp -r openwrt/bin/targets/ramips/mt7621/* release/ 2>/dev/null || true
        echo "=== 待发布文件 ===" && ls -lh release/
        echo "firmware_count=$(ls release/ | wc -l)" >> $GITHUB_OUTPUT

    - name: Create Release and Upload Firmware
      uses: softprops/action-gh-release@v2
      if: steps.image.outputs.has_firmware == 'yes' && steps.prep.outputs.firmware_count != '0'
      with:
        tag_name: jdcloud-re-sp-01b-${{ github.run_number }}
        name: OpenWrt 京东云一代 RE-SP-01B #${{ github.run_number }}
        files: release/*
        body: |
          ## JDCloud RE-SP-01B（京东云一代）OpenWrt 固件

          - 源码：openwrt/openwrt v25.12.2
          - 刷机：通过 Breed 上传 `*-squashfs-sysupgrade.bin`
          - 默认管理地址：`192.168.12.1`
          - 用户名：`root`，密码：`pcy831121`
          - 主题：Argon（蓝色现代化界面）
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
