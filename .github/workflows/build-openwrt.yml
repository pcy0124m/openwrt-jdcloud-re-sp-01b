name: Build OpenWrt for JDCloud RE-SP-01B

on:
  workflow_dispatch:
  # schedule:
  #   - cron: 0 16 * * *  # 北京时间每天 0:00 编译

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  # 锁定源码 commit（避免 rolling update 导致补丁不兼容）
  # 此 commit 已被验证可成功编译 mt7621 (来源: Siha06/openwrt-xy R2026-04-16)
  # 如需更新源码，修改此值或设为空字符串跟随 master
  REPO_COMMIT: ecec1ef93a8920f30ef927d989b13b674d614ca6
  CONFIG_FILE: config/jdcloud-re-sp-01b.config
  DIY_SH: diy.sh
  FREE_UP_DISK: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
  # 使用阿里云镜像加速下载（apt 走 Ubuntu 镜像，make download 走 OpenWrt 镜像）
  OPENWRT_MIRROR: https://mirrors.aliyun.com/openwrt
  DOWNLOAD_MIRROR: https://mirrors.aliyun.com/openwrt

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 将 apt 源切换为阿里云镜像，加速依赖安装
        sudo sed -i 's|http://archive.ubuntu.com/ubuntu/|https://mirrors.aliyun.com/ubuntu/|g' /etc/apt/sources.list
        sudo sed -i 's|http://security.ubuntu.com/ubuntu/|https://mirrors.aliyun.com/ubuntu/|g' /etc/apt/sources.list
        # 安装编译依赖（GitHub Runner 已自带并启用 swap，不要自建 /swapfile，否则会报 Text file busy）
        sudo apt-get update
        sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano python3 python3-pip python3-pexpect python3-yaml rsync sphinx-doc subversion swig texinfo uglifyjs upx-ucl unzip wget zlib1g-dev
        # 清理磁盘空间
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        # 如果指定了 commit，锁定到该版本（避免 rolling update 导致补丁不兼容）
        if [ -n "$REPO_COMMIT" ]; then
          echo "锁定源码到 commit: $REPO_COMMIT"
          git checkout "$REPO_COMMIT"
        fi
        git submodule update --init --recursive

    - name: Apply patches
      run: |
        cp $GITHUB_WORKSPACE/diy.sh openwrt/
        cd openwrt
        bash diy.sh

    - name: Download feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply config
      run: |
        cd openwrt
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -la {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile
      id: compile
      run: |
        cd openwrt
        # 确保 host 工具 (po2lmo 等) 在 PATH 中
        export PATH="$PATH:$PWD/staging_dir/host/bin"
        echo "[INFO] 已添加 staging_dir/host/bin 到 PATH"
        # 先构建工具链和 host 工具（确保 po2lmo 等在主编译前就绪）
        echo "[INFO] 预构建 tools/toolchain..."
        make tools/install -j$(nproc) || make tools/install -j1 V=s
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
        echo "[INFO] 开始全量编译..."
        make -j$(nproc) || make -j1 V=s
        echo "status=$?" >> $GITHUB_OUTPUT

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == '0'
      with:
        name: openwrt-jdcloud-re-sp-01b
        path: openwrt/bin/targets/
